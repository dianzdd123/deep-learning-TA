# Cloudflare Worker configuration for Diana.
# Create TWO KV namespaces in Cloudflare and replace both placeholder IDs.
name = "diana-deep-learning-ta"
main = "worker.js"
compatibility_date = "2026-11-07"
workers_dev = true

[vars]
OPENAI_MODEL = "gpt-4.1-mini"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_YOUR_CLOUDFLARE_KV_NAMESPACE_ID"

# OPENAI_API_KEY, TURNSTILE_SECRET, SESSION_SECRET are private Cloudflare secrets.
# NEVER add them here or in the GitHub repository.

[[kv_namespaces]]
binding = "ACCESS_CODES"
id = "REPLACE_WITH_YOUR_ACCESS_CODES_KV_NAMESPACE_ID"

# ACCESS_CODES keeps hashed student codes and their enabled/expiry settings.
# Never commit raw student codes or SESSION_SECRET.
