name: Refresh approved Diana course index

on:
  push:
    branches: [main]
    paths:
      - 'materials/**'
      - 'scripts/build_materials.py'
      - '.github/workflows/index-materials.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diana-material-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install indexed document readers
        run: python -m pip install pypdf python-pptx
      - name: Regenerate approved public course index
        run: python scripts/build_materials.py
      - name: Commit generated index when materials have changed
        run: |
          if ! git diff --quiet -- data/materials-index.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/materials-index.json
            git commit -m 'Refresh approved Diana course excerpts'
            git push
          fi
